{% extends "admin/change_list.html" %}

{% block content %}
<!-- Live Order Alert Popup -->
<div id="newOrderBanner" style="display:none; background-color:#dc2626; color:white; padding:14px 22px; font-weight:bold; font-size:16px; border-radius:12px; margin-bottom:18px; box-shadow:0 8px 20px rgba(220, 38, 38, 0.3);">
    🔔 NEW ORDER RECEIVED! Page updated automatically.
</div>

{{ block.super }}

<script>
(function() {
    function playChime() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const now = audioCtx.currentTime;
            
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(659.25, now);
            gain1.gain.setValueAtTime(0.3, now);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(now);
            osc1.stop(now + 0.5);

            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(880, now + 0.2);
            gain2.gain.setValueAtTime(0.4, now + 0.2);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(now + 0.2);
            osc2.stop(now + 0.8);
        } catch (e) {
            console.error('Audio chime failed:', e);
        }
    }

    if (sessionStorage.getItem('new_order_arrived') === 'true') {
        sessionStorage.removeItem('new_order_arrived');
        const banner = document.getElementById('newOrderBanner');
        if (banner) banner.style.display = 'block';
        playChime();
        setTimeout(() => {
            if (banner) banner.style.display = 'none';
        }, 6000);
    }

    function getDomMaxId() {
        const rows = document.querySelectorAll('#result_list tbody tr');
        let maxId = 0;
        rows.forEach(row => {
            const idCell = row.querySelector('.field-id a') || row.querySelector('.field-id');
            if (idCell) {
                const idVal = parseInt(idCell.textContent.trim().replace('#', ''), 10);
                if (!isNaN(idVal) && idVal > maxId) {
                    maxId = idVal;
                }
            }
        });
        return maxId;
    }

    const currentMaxId = getDomMaxId();
    if (!sessionStorage.getItem('last_seen_order_id')) {
        sessionStorage.setItem('last_seen_order_id', currentMaxId.toString());
    }

    setInterval(async () => {
        try {
            const response = await fetch('/api/orders/check-latest/');
            if (response.ok) {
                const data = await response.json();
                const lastSeenId = parseInt(sessionStorage.getItem('last_seen_order_id') || '0', 10);

                if (data.latest_id > lastSeenId) {
                    sessionStorage.setItem('last_seen_order_id', data.latest_id.toString());
                    sessionStorage.setItem('new_order_arrived', 'true');
                    window.location.reload();
                }
            }
        } catch (err) {
            console.error('Error polling latest orders:', err);
        }
    }, 4000);
})();
</script>
{% endblock %}
